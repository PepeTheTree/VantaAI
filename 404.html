<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>VantaAI — Page Not Found</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f; color: #e4e4eb;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px;
        }
        h1 { font-size: 4rem; font-weight: 700; color: #7c3aed; margin-bottom: 16px; }
        p { color: #8888a0; font-size: 1.1rem; margin-bottom: 32px; line-height: 1.6; }
        a {
            display: inline-block;
            background: #7c3aed; color: white; padding: 12px 28px;
            border-radius: 10px; font-weight: 600; text-decoration: none;
            transition: background 0.2s;
        }
        a:hover { background: #6d28d9; }
    </style>
</head>
<body>
    <div>
        <h1>404</h1>
        <p>Melody looked everywhere but couldn't find this page.</p>
        <a href="/">Go Home</a>
    </div>
</body>
</html>
